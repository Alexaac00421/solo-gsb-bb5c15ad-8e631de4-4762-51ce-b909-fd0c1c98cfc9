name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: fare_test
          POSTGRES_USER: fare
          POSTGRES_PASSWORD: farepass
          TZ: Asia/Shanghai
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fare -d fare_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      TZ: Asia/Shanghai
      TEST_DATABASE_DSN: "host=127.0.0.1 port=5432 dbname=fare_test user=fare password=farepass"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: pytest -q
